services:
  v-core:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./agents/v_core/qdrant_storage:/app/agents/v_core/qdrant_storage
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OLLAMA_HOST: ${OLLAMA_HOST}
      PROXMOX_HOST: ${PROXMOX_HOST}
      PROXMOX_USER: ${PROXMOX_USER}
      PROXMOX_PASSWORD: ${PROXMOX_PASSWORD}
      QDRANT_LOCAL_PATH: "/app/agents/v_core/qdrant_storage"
    restart: unless-stopped
